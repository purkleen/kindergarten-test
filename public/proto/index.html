<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunshine Kindergarten · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* ---------------------------------------------------------------------------
   Tokens — named from the Figma file (Dashboard › Version 04).
--------------------------------------------------------------------------- */
:root {
  --cream:       #FBF7F0;   /* Surface/Cream App      */
  --card:        #FFFFFF;
  --card-warm:   #FFFEFB;
  --ink:         #2B2540;   /* Ink/900 Primary        */
  --ink-900:     #20182B;   /* color/neutral/900      */
  --ink-body:    #3B354D;
  --ink-2:       #746B7D;   /* color/neutral/600      */
  --muted:       #8A83A0;   /* ink/muted              */
  --muted-2:     #9A93A8;   /* Ink/400 Muted          */
  --tag-ink:     #352D40;
  --line:        #E4E0EC;   /* border/hairline        */
  --line-2:      #ECE7F3;
  --line-3:      #DED8E4;
  --line-4:      #BEB4C8;   /* color/neutral/300      */
  --n100:        #F0EDF3;   /* color/neutral/100      */

  --purple:      #7C3AED;   /* color/purple/500       */
  --purple-600:  #6927D8;
  --purple-sec:  #6946C9;   /* color/source/secondary */
  --purple-50:   #F4EEFF;
  --violet-tint: #F1ECFA;
  --switch:      #5B4FF5;
  --rose:        #E14372;   /* illustration-rose      */
  --orange:      #F5993B;
  --orange-bg:   #FFF0DE;
  --yellow:      #FFF3B8;
  --yellow-cta:  #FFD84D;
  --green:       #37B87C;
  --green-bg:    #E9F1E6;
  --green-ink:   #3F6955;
  --sky:         #E7F3F6;
  --peach:       #FCE9DD;
  --blush:       #F6E7E7;
  --bubble-me:   #246BFD;
  --bubble-them: #ECEFF3;

  --r-control: 16px; --r-lg: 24px; --r-card: 20px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: inherit; }
img { display: block; }

body {
  font-family: var(--font);
  color: var(--ink);
  background: #2c2c2c;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  padding: 28px 16px;
}

/* --- role switch above the device -------------------------------------- */
.proto-bar { display: flex; align-items: center; gap: 12px; color: #d9d4e2; font-size: 13px; }
.seg { display: inline-flex; background: #3b3842; border-radius: 999px; padding: 4px; }
.seg button { padding: 7px 16px; border-radius: 999px; color: #d9d4e2; font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--purple); color: #fff; }
.proto-bar .restart { text-decoration: underline; color: #b9b2c6; }

/* --- device --------------------------------------------------------------- */
.device {
  position: relative; width: 402px; height: 874px; flex: none;
  border-radius: 62px; overflow: hidden; background: var(--cream);
  box-shadow: 0 0 0 10px #111, 0 30px 80px rgba(0,0,0,.5);
  isolation: isolate;
}
@media (max-width: 520px) {
  body { padding: 0; background: var(--cream); }
  .proto-bar { display: none; }
  .device { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
}

/* --- icons: the Figma SVGs used as masks so they take currentColor -------- */
.ic { display: inline-block; flex: none; width: 24px; height: 24px; background: currentColor;
      -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
.ic.s16 { width: 16px; height: 16px; } .ic.s18 { width: 18px; height: 18px; } .ic.s20 { width: 20px; height: 20px; }
.ic.s40 { width: 40px; height: 40px; }

/* --- screen scaffold ------------------------------------------------------ */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--cream); }
.screen.enter { animation: enter .22s ease-out; }
.screen.enter-back { animation: enter-back .22s ease-out; }
@keyframes enter { from { transform: translateX(28px); opacity: .4; } }
@keyframes enter-back { from { transform: translateX(-28px); opacity: .4; } }

.top { flex: none; padding: 19px 16px 0; display: flex; flex-direction: column; gap: 12px; height: 106px; }
.status { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
.status .time { font-family: 'Nunito', var(--font); font-weight: 700; font-size: 16px; color: var(--ink); width: 71px; }
.status .island { width: 120px; height: 35px; border-radius: 22px; background: #12101C; }
.status .ind { width: 71px; display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.status .ind img:nth-child(1) { width: 18px; height: 11px; }
.status .ind img:nth-child(2) { width: 16px; height: 11px; }
.status .ind img:nth-child(3) { width: 25px; height: 12px; }
.dark .status .time { color: #fff; }

.titlebar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.titlebar h1 { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--ink-900); white-space: nowrap; }
.titlebar .side { width: 89px; display: flex; align-items: center; gap: 9px; }
.titlebar .side.r { justify-content: flex-end; }
.titlebar .side.wide { width: auto; flex: 1; }
.round-btn { width: 32px; height: 32px; border-radius: 999px; background: var(--purple-sec); color: #fff;
             display: grid; place-items: center; }
.round-btn.fab { background: var(--purple); }
.back-btn { width: 40px; height: 40px; color: #000; display: grid; place-items: center; }
.text-btn { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--purple-sec); }

.body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.body.tight { padding-top: 16px; gap: 23px; }
.body.gap16 { gap: 16px; }

.homebar { flex: none; height: 34px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
.homebar i, .tabbar .hi { width: 135px; height: 5px; border-radius: 999px; background: #2E2545; opacity: .22; }

/* --- tab bar -------------------------------------------------------------- */
.tabbar { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 9px 0 10px;
          display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tabbar .tabs { width: 100%; display: flex; align-items: center; padding: 0 8px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0;
       font-size: 10px; font-weight: 800; color: var(--ink-900); }
.tab.on { color: var(--purple); }
.tab-fab { flex: 1; display: flex; justify-content: center; }
.tab-fab button { width: 52px; height: 52px; border-radius: 999px; background: var(--purple); color: #fff;
                  display: grid; place-items: center; box-shadow: 0 3px 8px rgba(53,20,99,.1); transition: transform .15s; }
.tab-fab button:active { transform: scale(.94); }

/* --- shared building blocks ---------------------------------------------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px;
       background: var(--n100); border: 1px solid var(--line-3); font-size: 10px; line-height: 14px; font-weight: 600; color: var(--tag-ink); white-space: nowrap; }
.tag.purple { background: var(--purple-50); border-color: transparent; }
.tag.solid { background: var(--purple-600); color: #fff; border-color: transparent; height: 20px; }
.tag.yellow { background: var(--yellow); border-color: transparent; }
.tag.green { background: var(--green-bg); border-color: transparent; color: var(--green-ink); height: auto; padding: 4px 8px; }
.tag.cal { background: #FFF0B3; border-color: transparent; height: 20px; }

.section-title { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px;
                 color: var(--purple-sec); font-weight: 600; }
.section-title .h { font-size: 16px; line-height: 24px; }
.section-title .h.sm { font-size: 12px; line-height: 16px; font-weight: 400; }
.section-title .link { font-size: 14px; line-height: 20px; text-decoration: underline; }
.section-title .link.plain { text-decoration: none; }
.divider { height: 1px; background: var(--line); }

.ev-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; }
.ev-row + .ev-row { border-top: 1px solid var(--line); }
.date-chip { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--violet-tint);
             display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; }
.date-chip .m { font-size: 9px; font-weight: 800; color: var(--rose); line-height: 12px; }
.date-chip .d { font-size: 16px; color: #2E2545; line-height: 18px; }
.date-chip.big { width: 52px; height: 52px; }
.date-chip.big .m { font-size: 10px; } .date-chip.big .d { font-size: 22px; line-height: 26px; }
.ev-copy { flex: 1; min-width: 0; }
.ev-copy .t { font-size: 16px; line-height: 24px; font-weight: 600; color: #2E2545; }
.ev-copy .s { font-size: 12px; line-height: 16px; color: var(--muted); }

.btn { height: 52px; border-radius: var(--r-control); display: flex; align-items: center; justify-content: center;
       padding: 0 18px; font-size: 14px; line-height: 20px; font-weight: 600; width: 100%; flex: none; transition: transform .1s, filter .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--purple); color: #fff; box-shadow: 0 2px 8px rgba(36,27,46,.04); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.outline { border: 1px solid var(--line-4); color: var(--ink-900); background: transparent; }
.btn.yellow { background: var(--yellow-cta); color: var(--ink-900); height: 44px; font-size: 12px; }
.btn.link { height: auto; text-decoration: underline; color: var(--ink-900); font-size: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; flex: none; }
.pills::-webkit-scrollbar { display: none; }
.pill { height: 34px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line-2); background: #fff;
        display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-900); white-space: nowrap; flex: none; }
.pill.on { background: var(--orange-bg); border-color: var(--orange); }
.pill.tall { height: 50px; padding-left: 10px; }
.pill.tall.txt { padding-left: 16px; }
.pill img { width: 32px; height: 32px; border-radius: 999px; object-fit: cover; }
.chip { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--purple-50); font-size: 12px; color: var(--tag-ink); white-space: nowrap; flex: none; display: inline-flex; align-items: center; }
.chip.on { background: var(--purple-600); color: #fff; }

.switch { display: flex; gap: 8px; flex: none; }
.switch button { flex: 1; text-align: center; height: 44px; border-radius: 10px; border: 1px solid #CAC6D8; background: #fff; font-size: 14px; font-weight: 500; color: #2D2939; }
.switch button.on { background: var(--switch); border-color: var(--switch); color: #fff; }

.avatar { border-radius: 999px; object-fit: cover; flex: none; }

/* fields */
.field { display: flex; flex-direction: column; gap: 7px; flex: none; }
.field > label, .field > .lbl { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--tag-ink); }
.field.light > label { font-weight: 400; }
.input { height: 52px; border: 1px solid var(--line-3); background: #fff; border-radius: var(--r-control);
         padding: 0 16px; font-size: 16px; color: var(--ink-900); width: 100%; outline: none; transition: border-color .15s; }
.input.sm { font-size: 14px; }
.input::placeholder, textarea::placeholder { color: var(--ink-2); }
.input:focus, textarea.input:focus { border: 2px solid var(--purple); padding: 0 15px; }
textarea.input { height: auto; min-height: 120px; padding: 12px 16px; line-height: 24px; resize: none; }
textarea.input:focus { padding: 11px 15px; }
.select-wrap { position: relative; }
.select-wrap select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.select-wrap .ic { position: absolute; right: 16px; top: 18px; color: var(--ink-2); pointer-events: none; }
.row2 { display: flex; gap: 12px; } .row2 > * { flex: 1; min-width: 0; }
.counter { font-size: 10px; color: var(--muted-2); text-align: right; margin-top: -30px; margin-right: 12px; pointer-events: none; height: 20px; }

/* toast */
.toast { position: absolute; left: 16px; right: 16px; bottom: 110px; z-index: 50; background: var(--ink-900); color: #fff;
         border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25);
         animation: toast 2.4s ease forwards; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 30; animation: fade .2s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--cream); border-radius: 30px 30px 0 0;
         padding: 31px 18px 34px; display: flex; flex-direction: column; gap: 12px; animation: up .25s cubic-bezier(.2,.8,.2,1); }
.sheet::before { content: ''; position: absolute; top: 12px; left: 50%; margin-left: -20px; width: 40px; height: 5px; border-radius: 999px; background: #DDD6E6; }
.sheet-opt { background: #fff; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center;
             filter: drop-shadow(0 2px 4px rgba(43,37,64,.1)); width: 100%; }
.sheet-opt .t { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.sheet-opt .s { font-size: 14px; line-height: 20px; color: var(--muted-2); }
.sheet .close { height: 52px; font-size: 14px; font-weight: 600; text-decoration: underline; color: var(--ink-900); text-align: center; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }

/* --- role picker + login -------------------------------------------------- */
.login { background: #F8F7FA; }
.login .body { padding: 18px 24px; justify-content: space-between; gap: 34px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: -.17px; color: #201A26; }
.brand img { width: 44px; height: 44px; }
.welcome h2 { font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -.64px; color: #201A26; }
.welcome p { font-size: 15px; line-height: 22px; color: #6C6572; margin-top: 8px; }
.role-card { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line-3); border-radius: 20px; padding: 16px;
             width: 100%; transition: border-color .15s, box-shadow .15s; }
.role-card:hover { border-color: var(--purple); box-shadow: 0 8px 24px rgba(43,37,64,.06); }
.role-card .badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.role-card .t { font-size: 17px; font-weight: 600; color: var(--ink); }
.role-card .s { font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 2px; }
.role-card .ic { color: var(--muted); margin-left: auto; }
.pw { position: relative; }
.pw .eye { position: absolute; right: 12px; top: 4px; width: 44px; height: 44px; display: grid; place-items: center; color: #352D40; }
.forgot { font-size: 14px; font-weight: 600; color: var(--purple); text-decoration: underline; text-align: right; display: block; margin-top: 10px; }
.acct { text-align: center; font-size: 15px; color: #6C6572; }
.acct a { font-size: 14px; font-weight: 600; color: var(--purple); margin-left: 6px; }

/* --- dashboard ----------------------------------------------------------- */
.announce { background: var(--purple-50); border-radius: var(--r-lg); padding: 16px; position: relative; flex: none; box-shadow: 0 2px 10px rgba(43,37,64,.04); }
.announce .k { font-size: 10px; font-weight: 600; letter-spacing: .2px; color: var(--tag-ink); text-transform: uppercase; }
.announce .t { font-size: 14px; font-weight: 600; color: var(--ink-900); margin-top: 12px; }
.announce .b { font-size: 14px; line-height: 20px; color: var(--ink-2); margin-top: 4px; padding-right: 8px; }
.announce .x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; display: grid; place-items: center; color: #000; }
.announce .dots { display: flex; gap: 5px; margin-top: 12px; }
.announce .dots i { width: 6px; height: 6px; border-radius: 99px; background: #D8CDF2; }
.announce .dots i.on { background: var(--purple); width: 16px; }

.services { background: var(--card-warm); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 1px 4px rgba(12,12,13,.05); flex: none; }
.services h3 { font-size: 21px; line-height: 32px; font-weight: 600; color: var(--ink-900); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { min-height: 118px; border-radius: var(--r-control); padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
        font-size: 20px; line-height: 24px; font-weight: 600; color: var(--ink-900); transition: transform .12s; }
.tile:active { transform: scale(.97); }
.tile .ib { width: 36px; height: 36px; border-radius: 999px; background: #fff; display: grid; place-items: center; }
.tile.full { grid-column: 1 / -1; }

.mgmt { display: flex; flex-direction: column; gap: 12px; flex: none; }
.opt { background: #fff; border: 1px solid #E3DDE8; border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; width: 100%; transition: border-color .15s; }
.opt:hover { border-color: #cfc3e6; }
.opt.hl { border: 2px solid var(--purple); box-shadow: 0 8px 24px rgba(43,37,64,.05); padding: 15px; }
.opt .head { display: flex; align-items: center; justify-content: space-between; }
.opt .tg { display: flex; align-items: center; gap: 11px; }
.opt .badge { width: 40px; height: 40px; border-radius: 12px; background: var(--n100); display: grid; place-items: center; color: #2B2540; }
.opt.hl .badge { background: var(--purple-50); color: var(--purple); }
.opt .t { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink); }
.opt .st { font-size: 12px; line-height: 16px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.opt.hl .st { color: var(--purple-600); }
.opt .st .red { width: 8px; height: 8px; border-radius: 99px; background: #E50000; }
.opt .desc { font-size: 12px; line-height: 16px; color: var(--ink-2); }
.opt .arrow { color: #746B7D; } .opt.hl .arrow { color: var(--purple); }

.feed-post { padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.feed-post + .feed-post { border-top: 1px solid var(--line); }
.feed-post .a { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #2E2545; }
.feed-post .p { font-size: 14px; line-height: 20px; color: #6B6480; }
.feed-post .m { font-size: 12px; line-height: 16px; color: var(--muted); }

/* --- posts / observations ------------------------------------------------ */
.post { background: #fff; border: 1px solid var(--line-2); border-radius: var(--r-control); padding: 16px; display: flex; flex-direction: column; gap: 11px; flex: none; }
.post .hd { display: flex; align-items: center; justify-content: space-between; }
.post .who { display: flex; align-items: center; gap: 11px; }
.post .who img { width: 42px; height: 42px; }
.post .nm { display: flex; align-items: center; gap: 7px; font-family: 'Fredoka', var(--font); font-weight: 600; font-size: 15.5px; color: var(--ink); }
.post .ago { font-size: 12px; line-height: 16px; color: var(--muted-2); }
.post .txt { font-size: 16px; line-height: 24px; color: var(--ink-body); }
.post .ph { height: 230px; border-radius: 18px; object-fit: cover; width: 100%; }
.post .acts { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--ink); }
.post .acts button { display: inline-flex; align-items: center; gap: 2px; }
.post .acts button.liked { color: var(--rose); }
.post .child { display: flex; align-items: center; justify-content: space-between; }
.post .child .c { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.post .child .c b { display: block; font-weight: 600; color: var(--ink-900); line-height: 18px; }
.post .child .c span { color: var(--ink-2); line-height: 20px; }
.post .sep { height: 1px; background: var(--line-2); }
.post .decide { display: flex; gap: 11px; padding-top: 24px; }
.post.leaving { animation: leave .3s ease forwards; }
@keyframes leave { to { opacity: 0; transform: scale(.96); } }

.obs { background: var(--card-warm); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 5px 18px rgba(59,38,48,.05); flex: none; }
.obs > img { width: 100%; height: 166px; object-fit: cover; }
.obs .in { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.obs .kid { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.obs .kid b { display: block; font-weight: 600; color: var(--ink-900); line-height: 18px; }
.obs .kid span { color: var(--ink-2); }
.obs .meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.obs .meta > div { display: flex; gap: 12px; align-items: center; }
.obs .txt { font-size: 16px; line-height: 24px; color: var(--ink-body); }
.obs .by { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.obs .by img { width: 32px; height: 32px; background: #FFE9A8; }

/* tappable cards, ⋯ menu, detail views */
.tappable { cursor: pointer; transition: transform .12s, box-shadow .15s; }
.tappable:active { transform: scale(.99); }
.dots { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: var(--ink); flex: none; margin-right: -6px; }
.dots:hover { background: var(--n100); }

.post-title { font-size: 17px; line-height: 24px; font-weight: 600; color: var(--ink-900); margin-bottom: -6px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.obs-ph { width: 100%; object-fit: cover; display: block; }
.story-frame { display: flex; justify-content: center; position: relative; overflow: hidden; width: 100%; flex: none; }
.story-frame::before { content: ''; position: absolute; inset: -20px; background: var(--bg) center / cover; filter: blur(18px) brightness(.85); }
.story-frame .story { position: relative; border-radius: 0; box-shadow: none; }
.hero.story-frame .story { border-radius: 12px; }
.obs .kid-row2 { display: flex; align-items: center; justify-content: space-between; }
.post-detail-head, .obs-kid, .obs-by { display: flex; align-items: center; gap: 11px; flex: none; }
.post-detail-head .nm { display: flex; align-items: center; gap: 7px; font-family: 'Fredoka', var(--font); font-weight: 600; font-size: 16px; color: var(--ink); }

.obs-kid b, .obs-by b { display: block; font-size: 15px; font-weight: 600; color: var(--ink-900); }
.obs-kid span, .obs-by span { font-size: 13px; color: var(--ink-2); }
.obs-meta { display: flex; align-items: center; gap: 10px; flex: none; }
.post-acts { display: flex; gap: 20px; font-size: 14px; color: var(--ink); flex: none; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.post-acts > * { display: inline-flex; align-items: center; gap: 6px; }
.post-acts .liked { color: var(--rose); }
.comments { display: flex; flex-direction: column; gap: 10px; flex: none; }
.cmt { background: #fff; border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 14px; }
.cmt b { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cmt p { font-size: 14px; line-height: 20px; color: var(--ink-900); margin-top: 2px; }
.cmt.new { animation: pop .2s ease-out; }
.pop-scrim { position: absolute; inset: 0; z-index: 40; }
.pop { position: absolute; z-index: 41; min-width: 196px; background: #fff; border-radius: 16px; padding: 6px; box-shadow: 0 12px 36px rgba(43,37,64,.18), 0 0 0 1px rgba(43,37,64,.05);
       animation: popin .14s ease-out; transform-origin: top right; }
.pop.up { transform-origin: bottom right; }
@keyframes popin { from { opacity: 0; transform: scale(.92); } }
.pop button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 10px; font-size: 15px; font-weight: 500; color: var(--ink-900); }
.pop button:hover { background: var(--n100); }
.pop button.danger { color: #C0264F; }
.dialog-scrim { position: absolute; inset: 0; z-index: 45; background: rgba(18,16,28,.45); animation: fade .15s ease; }
.dialog { position: absolute; z-index: 46; left: 28px; right: 28px; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 22px; padding: 24px 20px 18px;
          text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: popin .16s ease-out; }
.dialog h3 { font-size: 18px; font-weight: 600; color: var(--ink-900); }
.dialog p { font-size: 14px; line-height: 20px; color: var(--ink-2); margin: 8px 0 20px; }
.dialog .row { display: flex; gap: 10px; }
.dialog .btn { height: 46px; }
.btn.destructive { background: #D2335C; color: #fff; }

/* --- app tour ------------------------------------------------------------ */
.tour { position: absolute; inset: 0; z-index: 60; }
.tour .spot { position: absolute; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(18,16,28,.62); transition: all .3s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.tour .spot::after { content: ''; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid rgba(255,255,255,.85); animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.06); } }
.tour .tip { position: absolute; left: 16px; right: 16px; background: #fff; border-radius: 22px; padding: 20px 20px 16px; box-shadow: 0 18px 44px rgba(0,0,0,.28); animation: tipin .25s ease-out; }
@keyframes tipin { from { opacity: 0; transform: translateY(8px); } }
.tour .tip .k { font-size: 12px; font-weight: 700; letter-spacing: .4px; color: var(--purple); text-transform: uppercase; }
.tour .tip h3 { font-size: 20px; line-height: 26px; font-weight: 600; color: var(--ink-900); margin: 6px 0 6px; }

.tour .tip .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.tour .tip .dots3 { display: flex; gap: 5px; }
.tour .tip .dots3 i { width: 6px; height: 6px; border-radius: 9px; background: #DDD6E6; transition: all .2s; }
.tour .tip .dots3 i.on { width: 18px; background: var(--purple); }
.tour .tip .btns { display: flex; align-items: center; gap: 14px; }
.tour .tip .skip { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.tour .tip .next { height: 40px; padding: 0 20px; border-radius: 12px; background: var(--purple); color: #fff; font-size: 14px; font-weight: 600; }

/* --- lists: chat, notifications, menu, children ------------------------- */
.list { border: 1px solid var(--line); border-radius: var(--r-control); overflow: hidden; box-shadow: 0 1px 4px rgba(12,12,13,.05); flex: none; }
.li { background: #fff; display: flex; align-items: center; gap: 16px; padding: 18px 12px; min-height: 88px; width: 100%; transition: background .12s; }
.li:hover { background: #fdfcff; }
.li + .li { border-top: 1px solid var(--line); }
.li .av { width: 52px; height: 52px; }
.li .c { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.li .r1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.li .r1 > div { display: flex; align-items: center; gap: 8px; }
.li .n { font-size: 14px; font-weight: 600; color: #241A3A; white-space: nowrap; }
.li .time { font-size: 12px; color: #81758F; white-space: nowrap; }
.li .msg { font-size: 14px; line-height: 20px; color: #241A3A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.li .r2 { display: flex; align-items: center; gap: 8px; } .li .r2 .msg { flex: 1; }
.unread { background: var(--green); color: #fff; font-size: 10px; font-weight: 600; height: 17px; min-width: 16px; border-radius: 10px; display: grid; place-items: center; padding: 0 4px; }

.notif { background: #fff; border-radius: var(--r-control); padding: 14px 12px; display: flex; gap: 11px; flex: none; }

.notif .t b { font-weight: 600; }
.notif .s { font-size: 14px; line-height: 20px; color: var(--ink-2); }
.notif .a { font-size: 12px; color: var(--muted-2); margin-top: 4px; }

.menu { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; flex: none; }
.menu button { display: flex; align-items: center; gap: 12px; padding: 12px 16px; width: 100%; font-size: 14px; line-height: 20px; font-weight: 600; color: #2E2545; }
.menu button + button { border-top: 1px solid var(--line); }
.menu button:hover { background: #fdfcff; }

.contact { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #fff; width: 100%; }
.contact + .contact { border-top: 1px solid var(--line); }
.contact img { width: 32px; height: 32px; }
.contact .n { font-size: 16px; font-weight: 600; color: var(--ink-900); display: flex; align-items: center; gap: 8px; }
.contact .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.overline { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--ink-900); }

.kids-group { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; flex: none; }

.initials { width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--ink-900); flex: none; }

.stat { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: var(--r-control); padding: 12px 12px 14px; }
.stat b { font-size: 24px; font-weight: 600; color: var(--ink-900); display: block; }
.stat span { font-size: 12px; color: var(--ink-2); }
.panel { background: #fff; border: 1px solid #E3DDE8; border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 24px rgba(43,37,64,.05); flex: none; }
.hint { display: flex; gap: 7px; align-items: center; font-size: 12px; color: var(--ink-2); }

/* --- chat ---------------------------------------------------------------- */
.bubbles { display: flex; flex-direction: column; gap: 16px; }
.bub { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.bub .b { width: 273.6px; max-width: 80%; background: var(--bubble-me); color: #fff; font-size: 14px; line-height: 20px; padding: 12px 16px; border-radius: 18px 4px 18px 18px; }
.bub.them { align-items: flex-start; } .bub.them .b { background: var(--bubble-them); color: #18202A; border-radius: 4px 18px 18px 18px; }
.bub .b.img { padding: 4px; border-radius: 16px 4px 16px 16px; } .bub .b.img img { width: 100%; height: 168px; object-fit: cover; border-radius: 12px; }
.bub .mt { font-size: 11px; color: #81758F; }
.bub.new { animation: pop .2s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.composer { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 9px 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.composer form { display: flex; gap: 8px; width: 100%; }

.composer input:focus { border-color: var(--purple); }
.composer .send { width: 52px; height: 52px; flex: none; border-radius: 999px; background: var(--purple); color: #fff; font-size: 20px; font-weight: 600;
                  display: grid; place-items: center; padding-left: 3px; line-height: 1; }
.chat-head { display: flex; align-items: center; gap: 10px; }

.chat-head .s { font-size: 12px; color: #747A75; }

/* --- calendar ------------------------------------------------------------ */
.month { background: #fff; border-radius: var(--r-lg); padding: 20px 16px 16px; box-shadow: 0 2px 10px rgba(43,37,64,.04); flex: none; }
.month .mh { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.month .mh b { font-size: 24px; font-weight: 600; color: var(--ink-900); display: block; }
.month .mh span { font-size: 12px; color: var(--ink-2); }
.month .nav { display: flex; gap: 8px; }
.month .nav button { width: 36px; height: 36px; border-radius: 12px; background: #F0EDF3; display: grid; place-items: center; color: #000; }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
.grid7 .wd { font-size: 11px; color: var(--ink-2); padding-bottom: 8px; }
.day { height: 44px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-900); position: relative; gap: 3px; margin: 0 2px; }
.day.out { color: #B8B1C3; }
.day.today { border: 1px solid var(--purple); background: var(--purple-50); }

.cal-ev { background: #fff; border-radius: var(--r-card); padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex: none; box-shadow: 0 2px 10px rgba(43,37,64,.03); }

/* --- detail + journey stats --------------------------------------------- */
.hero { width: 100%; border-radius: var(--r-control); object-fit: cover; flex: none; }
.big-title { font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -.64px; color: var(--ink-900); }

.byline img { width: 40px; height: 40px; }
.byline span { display: block; color: var(--ink-2); font-weight: 600; }
.when { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; color: #000; }
.prose { font-size: 16px; line-height: 24px; color: #000; }
.prose.dim { color: #282039; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.jstat span { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.cta-card { background: var(--purple-50); border-radius: var(--r-lg); padding: 24px; display: flex; flex-direction: column; gap: 16px; flex: none; }

.child-card { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--card-warm); border: 1px solid #E8E0D7; width: 100%; filter: drop-shadow(0 5px 9px rgba(59,38,48,.05)); }
.child-card.on { background: #F7F1FF; border: 2px solid var(--purple); padding: 15px; }

.child-card b { font-size: 16px; font-weight: 600; color: var(--ink-900); display: block; }
.child-card span { font-size: 14px; line-height: 20px; color: var(--ink-2); display: block; }

.h2 { font-size: 24px; line-height: 32px; font-weight: 600; color: var(--ink-900); }
.sub { font-size: 14px; line-height: 20px; color: var(--ink-2); }

.photo-drop { height: 114px; border: 1px solid var(--line-3); background: #fff; border-radius: var(--r-control); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--ink-900); width: 100%; overflow: hidden; }

.photo-drop.filled img { width: 100%; height: 100%; object-fit: cover; }

.camera { background: #12101C; color: #fff; }
.camera .vf { flex: 1; margin: 0 8px; border-radius: 20px; background: radial-gradient(120% 80% at 50% 40%, #3a3f86 0%, #1c1d3d 60%, #151430 100%);
              display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 13px; line-height: 18px; color: #b9b6e0; text-align: center; padding: 0 60px; }

.camera .lib { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; border: 2px solid #fff; }
.camera .lib img { width: 100%; height: 100%; object-fit: cover; }
.camera .flip { width: 44px; height: 44px; border-radius: 999px; background: #3a3842; display: grid; place-items: center; font-size: 18px; }

/* --- photo editor (stories-style) --------------------------------------- */
.editor { background: #000; color: #fff; }
.canvas { position: absolute; inset: 0; overflow: hidden; container-type: size; }
.canvas > img.bg { width: 100%; height: 100%; object-fit: cover; }
.ov { position: absolute; transform: translate(-50%, -50%); touch-action: none; user-select: none; -webkit-user-select: none;
      cursor: grab; white-space: pre; text-align: center; line-height: 1.15; }
.ov.dragging { cursor: grabbing; }
.ov.emoji { font-size: 15cqw; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
.ov.text { font-size: 7.5cqw; font-weight: 700; letter-spacing: -.01em; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.ov.text.bg { text-shadow: none; padding: .18em .45em; border-radius: .3em; }
.ov.sticker { font-family: 'Fredoka', var(--font); font-weight: 600; font-size: 5.6cqw; padding: .4em .85em; border-radius: 999px;
              box-shadow: 0 6px 16px rgba(0,0,0,.2); transform: translate(-50%, -50%) rotate(-4deg); }
.ov.sel { outline: 2px dashed rgba(255,255,255,.95); outline-offset: 6px; border-radius: 10px; }
.ov.sticker.sel, .ov.text.bg.sel { border-radius: 999px; }
.ov-del { position: absolute; top: -18px; right: -18px; width: 26px; height: 26px; border-radius: 99px; background: #fff; color: #12101C;
          font-size: 12px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.3); font-family: var(--font); text-shadow: none; }
.ed-top { position: absolute; left: 0; right: 0; top: 0; z-index: 2; padding: 19px 16px 24px; pointer-events: none;
          background: linear-gradient(rgba(0,0,0,.45), transparent); }
.ed-top .status .time { color: #fff; }
.ed-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 12px; pointer-events: auto; }
.ed-tools { display: flex; flex-direction: column; gap: 12px; }
.ed-btn { width: 44px; height: 44px; border-radius: 999px; background: rgba(18,16,28,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
          color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 700; text-align: center; transition: transform .12s, background .15s; }
.ed-btn:active { transform: scale(.92); }
.ed-btn.on { background: #fff; color: #12101C; }

.ed-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 40px 16px 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
             background: linear-gradient(transparent, rgba(0,0,0,.5)); }
.ed-hint { font-size: 12px; line-height: 16px; color: rgba(255,255,255,.85); }
.ed-next { width: auto; padding: 0 28px; flex: none; }
.ed-scrim { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.35); animation: fade .15s ease; }
.tray { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(24,21,34,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-radius: 28px 28px 0 0; padding: 28px 16px 40px; animation: up .22s cubic-bezier(.2,.8,.2,1); }
.tray::before { content: ''; position: absolute; top: 10px; left: 50%; margin-left: -20px; width: 40px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.3); }
.tray h4 { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.7); margin-bottom: 14px; }
.tray .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tray .emojis button { font-size: 34px; height: 54px; border-radius: 14px; text-align: center; transition: background .12s; }
.tray .emojis button:hover { background: rgba(255,255,255,.1); }
.tray .stickers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tray .stickers button { font-family: 'Fredoka', var(--font); font-weight: 600; font-size: 17px; padding: 9px 16px; border-radius: 999px; }
.ed-text { position: absolute; inset: 0; z-index: 6; background: rgba(0,0,0,.6); display: flex; flex-direction: column; animation: fade .15s ease; }
.ed-text .row { display: flex; justify-content: space-between; align-items: center; padding: 72px 16px 0; }
.ed-text .done { font-size: 16px; font-weight: 700; color: #fff; padding: 8px 4px; }
.ed-text .mid { flex: 1; display: grid; place-items: center; padding: 0 24px; container-type: inline-size; }
.ed-input { display: inline-block; min-width: 20px; max-width: 100%; outline: none; text-align: center; white-space: pre-wrap; word-break: break-word;
            font-size: 30px; font-weight: 700; line-height: 1.15; caret-color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.ed-input.bg { padding: .18em .45em; border-radius: .3em; text-shadow: none; }
.ed-input:empty::before { content: attr(data-ph); color: rgba(255,255,255,.55); }
.ed-swatches { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 0 16px 48px; }
.ed-swatches .sw { width: 28px; height: 28px; border-radius: 99px; border: 2px solid rgba(255,255,255,.9); transition: transform .12s; }
.ed-swatches .sw.on { transform: scale(1.25); box-shadow: 0 0 0 2px rgba(0,0,0,.4); }
.ed-swatches .bgbtn { width: 34px; height: 34px; border-radius: 10px; border: 2px solid #fff; color: #fff; font-weight: 800; font-size: 16px; text-align: center; margin-right: 6px; }
.ed-swatches .bgbtn.on { background: #fff; color: #12101C; }

/* the finished photo, shown back on the form */
.story-col { display: flex; flex-direction: column; gap: 12px; align-items: center; flex: none; }
.story-actions { display: flex; gap: 8px; justify-content: center; }
.story-actions .btn { height: 40px; width: auto; padding: 0 16px; }
.btn.outline.danger { color: #C0264F; border-color: #EBC3CF; }
.story { position: relative; height: 300px; flex: none; border-radius: 16px; overflow: hidden; container-type: size; box-shadow: 0 8px 24px rgba(43,37,64,.12); }
.story img.bg { width: 100%; height: 100%; object-fit: cover; }
.story .ov { cursor: default; pointer-events: none; }

.webview { flex: 1; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: var(--ink-900); }

  /* ---------- calendar ---------- */
  calendar() {
    const { calMonth: m, calYear: y, calSel: sel } = S;
    const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
    const dots = new Set([2, 7, 10, 18, 22, 29]);
    const cells = [];
    for (let i = lead; i > 0; i--) cells.push(`<div class="day out">${prevDays - i + 1}</div>`);
    for (let d = 1; d <= days; d++) cells.push(`<button class="day ${d === sel ? 'sel' : ''} ${d === 13 && m === 9 && y === 2026 ? 'today' : ''}" data-act="cal-day" data-p="${d}">${d}${dots.has(d) || d === sel ? '<i></i>' : ''}</button>`);
    for (let d = 1; cells.length % 7; d++) cells.push(`<div class="day out">${d}</div>`);
    const monthName = first.toLocaleString('en-GB', { month: 'long' });
    const label = new Date(y, m, sel).toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const mon = monthName.slice(0, 3).toUpperCase();
    const kids = S.calChild === 'all' ? ['Emma', 'Christopher', 'Emma'] : [CHILDREN[S.calChild].name, CHILDREN[S.calChild].name];
    return { html: `

            <div class="nav"><button data-act="cal-nav" data-p="-1" aria-label="Previous month">${ic('month-prev', 's16')}</button><button data-act="cal-nav" data-p="1" aria-label="Next month"><i class="ic s16" style="--i:url(${IMG}month-prev.svg);transform:scaleX(-1)"></i></button></div></div>
          <div class="grid7">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div>
        </section>
        ${kids.map(k => `
          <button class="cal-ev" data-go="event" data-p="0">
            <div class="date-chip big"><span class="m">${mon}</span><span class="d">${sel}</span></div>
            <div class="ev-copy"><div class="tags"><span class="tag cal">Grasshoppers</span><span class="tag cal">${k}</span></div><div class="t">Spring family picnic</div><div class="s">Sat · 11:00 AM · Sunflower Garden</div></div>

const device = document.getElementById('device');
const cur = () => S.stack[S.stack.length - 1];

function render() {
  const { name, p } = cur();
  const out = screens[name](p);
  const anim = S.dir === 'none' ? '' : S.dir === 'back' ? 'enter-back' : 'enter';
  device.innerHTML = `<div class="screen ${out.cls || ''} ${anim}">${out.html}</div>`
    + (S.sheet ? sheetHtml() : '')
    + (S.menu ? menuHtml() : '')
    + (S.confirm ? confirmHtml() : '')
    + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  S.dir = 'none';
  S.toast = null;
  document.querySelectorAll('#roleSeg button').forEach(b => b.classList.toggle('on', b.dataset.role === S.role));
  const t = device.querySelector('#thread'); if (t) t.scrollTop = t.scrollHeight;
  const ed = device.querySelector('#edText');
  if (ed) { ed.focus(); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); getSelection().removeAllRanges(); getSelection().addRange(r); }
  if (S.tour != null && cur().name === 'dashboard') {
    /* Measure the spotlight target once the slide-in has finished. */
    const scr = device.querySelector('.screen');
    if (anim) scr.addEventListener('animationend', drawTour, { once: true }); else drawTour();
  }
}
function go(name, p) { S.stack.push({ name, p }); S.dir = 'fwd'; S.sheet = false; S.menu = null; render(); }
function back() { if (S.stack.length > 1) { S.stack.pop(); S.dir = 'back'; } S.sheet = false; S.menu = null; render(); }
function tab(name) { S.stack = [{ name }]; S.dir = 'none'; S.sheet = false; S.menu = null; render(); }
function toast(msg) { S.toast = msg; render(); }
function signIn(role) { S.role = role; S.stack = [{ name: 'dashboard' }]; S.dir = 'fwd'; S.tour = tourSeen(role) ? null : 0; render(); }

/* ---------- 3-step app tour: a spotlight on the dashboard, one script per role ---------- */
const TOUR = {
  parent: [
    { sel: '.tabbar .tabs', k: 'Find your way around', t: 'Everything about your children',
      b: 'Classrooms shows class updates, Learning holds Emma and Christopher’s journals, and Chat is where you message their teachers.' },
    { sel: '.tab-fab button', round: true, k: 'Share from home', t: 'Add a moment with +',
      b: 'Snap a photo, decorate it with text, stickers or emoji and send it to the teachers for your child’s learning journal.' },
    { sel: '.titlebar .side.r', k: 'Stay in the loop', t: 'Notifications and your profile',
      b: 'The bell shows what’s new. ⋯ opens your profile, where you can switch between your children and manage your account.' },
  ],
  teacher: [
    { sel: '.mgmt', k: 'Your day at a glance', t: 'Start with your to-do list',
      b: 'Review observations waiting for approval, manage announcements and look up any child in your groups.' },
    { sel: '.tab-fab button', round: true, k: 'Create in seconds', t: 'Post with +',
      b: 'Add an observation for one child, post an update for the whole class, or create an event — parents see it straight away.' },
    { sel: '.tabbar .tabs', k: 'Everything else', t: 'Classrooms, learning and chat',
      b: 'Browse each group’s feed, follow every child’s learning journey and reply to families in Chat.' },
  ],
};
function tourSeen(role) { try { return localStorage.getItem('tour-' + role) === '1'; } catch { return false; } }
function tourDone() { try { localStorage.setItem('tour-' + S.role, '1'); } catch {} S.tour = null; device.querySelector('.tour')?.remove(); }
function startTour() { S.stack = [{ name: 'dashboard' }]; S.dir = 'none'; S.sheet = false; S.menu = null; S.tour = 0; render(); }
function drawTour() {
  const steps = TOUR[S.role], step = steps[S.tour];
  const target = device.querySelector(step.sel);
  if (!target) return;
  const d = device.getBoundingClientRect(), r = target.getBoundingClientRect(), pad = 6;
  const box = { top: r.top - d.top - pad, left: r.left - d.left - pad, width: r.width + pad * 2, height: r.height + pad * 2 };
  const below = box.top + box.height / 2 < d.height * .5;
  const tipPos = below ? `top:${Math.round(box.top + box.height + 16)}px` : `bottom:${Math.round(d.height - box.top + 16)}px`;
  const last = S.tour === steps.length - 1;
  const el = document.createElement('div');
  el.className = 'tour';
  el.innerHTML = `
    <div class="spot" style="top:${box.top}px;left:${box.left}px;width:${box.width}px;height:${box.height}px;${step.round ? 'border-radius:999px' : ''}"></div>
    <div class="tip" style="${tipPos}" role="dialog" aria-label="App tour, step ${S.tour + 1} of ${steps.length}">
      <div class="k">${step.k}</div><h3>${step.t}</h3><p>${step.b}</p>
      <div class="foot">
        <div class="dots3">${steps.map((_, i) => `<i class="${i === S.tour ? 'on' : ''}"></i>`).join('')}</div>
        <div class="btns">${last ? '' : `<button class="skip" data-act="tour-skip">Skip</button>`}<button class="next" data-act="tour-next">${last ? 'Got it' : 'Next'}</button></div>
      </div>
    </div>`;
  device.appendChild(el);
}

/* ⋯ menu: the author can edit or delete; everyone else gets the usual non-owner actions. */
function findEntry(kind, id) { return (kind === 'post' ? S.posts : S.obs).find(x => x.id === id); }
function menuHtml() {
  const { kind, id, top, bottom, right } = S.menu, x = findEntry(kind, id);
  if (!x) return '';
  const pos = top != null ? `top:${top}px` : `bottom:${bottom}px`;
  const items = isMine(x)
    ? `<button data-act="menu-edit">${ic('notebook-pen', 's18')}Edit</button>
       <button class="danger" data-act="menu-delete"><i class="ic s18" style="--i:url(${IMG}plus.svg);transform:rotate(45deg)"></i>Delete</button>`
    : `<button data-act="toast" data-p="Link copied">${ic('arrow-up-right', 's18')}Copy link</button>
       <button data-act="toast" data-p="Thanks — the school office will take a look">${ic('info', 's18')}Report</button>`;
  return `<div class="pop-scrim" data-act="menu-close"></div><div class="pop ${top == null ? 'up' : ''}" style="${pos};right:${right}px" role="menu">${items}</div>`;
}
function confirmHtml() {
  const obs = S.confirm.kind === 'obs';
  return `<div class="dialog-scrim" data-act="confirm-cancel"></div>
    <div class="dialog" role="alertdialog">
      <h3>Delete this ${obs ? 'observation' : 'update'}?</h3>
      <p>${obs ? 'It will be removed from the learning journal.' : 'It will be removed for all parents in this class.'} This can’t be undone.</p>
      <div class="row"><button class="btn outline" data-act="confirm-cancel">Cancel</button><button class="btn destructive" data-act="confirm-delete">Delete</button></div>
    </div>`;
}

function sheetHtml() {
  const opts = [
    { act: 'new-obs', icon: 'binoculars', t: 'Add observation', s: 'Only parents of a specific child will see it' },
    { act: 'new-announcement', icon: 'star', t: 'Post class update', s: 'All parents for this class will see it' },
    { act: 'new-event', icon: 'calendar-add', t: 'Create event', s: 'All parents for this class will see it' },
  ];
  return `<div class="scrim" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-label="Create">
      ${opts.map(o => `<button class="sheet-opt" data-act="${o.act}">${ic(o.icon)}<div><div class="t">${o.t}</div><div class="s">${o.s}</div></div></button>`).join('')}
      <button class="close" data-act="close-sheet">Close</button>
    </div>`;
}

/* ===========================================================================
   Events
=========================================================================== */
const actions = {
  restart() { S.role = null; S.stack = [{ name: 'roles' }]; S.dir = 'back'; render(); },
  pick(p) { S.role = p; go('login'); },
  logout() { actions.restart(); },
  back, noop() {},
  peek() { const pw = device.querySelector('#pw'); pw.type = pw.type === 'password' ? 'text' : 'password'; },
  /* Parents can only add observations, so + skips the menu for them. */
  sheet() { if (S.role === 'parent') return actions['new-obs'](); S.sheet = true; render(); },
  'close-sheet'() { S.sheet = false; render(); },
  'new-obs'() { S.draft.obs = null; go('camera'); },
  'new-announcement'() { S.draft.announcement = null; go('new-announcement'); },
  'new-event'() { S.draft.event = null; go('new-event'); },
  /* A retake (from the form) keeps the draft's child and reflections; a fresh
     snap starts a new draft. */
  snap() {
    if (S.stack.some(s => s.name === 'new-obs')) Object.assign(obsDraft(), { overlays: [], noPhoto: false });
    else { S.draft.obs = null; obsDraft(); }
    S.edTool = null; S.edText = null; S.edSel = null; go('edit-photo');
  },
  'obs-edit-photo'() {
    if (S.stack.at(-2)?.name === 'edit-photo') back(); else go('edit-photo');
  },
  'obs-remove-photo'() { Object.assign(obsDraft(), { noPhoto: true, overlays: [] }); render(); },
  'obs-retake'() { go('camera'); },

  /* photo editor */
  'ed-tool'(p) { S.edTool = p && S.edTool !== p ? p : null; S.edSel = null; render(); },
  'ed-add'(type, el) {
    const d = obsDraft(), n = d.overlays.length;
    const o = { id: Date.now(), type, v: type === 'sticker' ? +el.dataset.v : el.dataset.v, x: 50 + ((n * 13) % 31) - 15, y: 55 + ((n * 17) % 21) - 10 };
    d.overlays.push(o); S.edSel = o.id; S.edTool = null; render();
  },
  'ed-del'(id) { const d = obsDraft(); d.overlays = d.overlays.filter(o => o.id !== +id); S.edSel = null; render(); },
  'ed-undo'() { obsDraft().overlays.pop(); S.edSel = null; render(); },
  'ed-deselect'() { if (S.edSel) { S.edSel = null; render(); } },
  'ed-text-new'() { S.edTool = null; S.edSel = null; S.edText = { id: null, v: '', color: '#FFFFFF', bg: false }; render(); },
  'ed-color'(c) { S.edText.color = c; render(); },
  'ed-bg'() { S.edText.bg = !S.edText.bg; render(); },
  'ed-text-cancel'() { S.edText = null; render(); },
  'ed-text-done'() {
    const t = S.edText, d = obsDraft(), v = t.v.trim();
    if (t.id) {
      const o = d.overlays.find(x => x.id === t.id);
      if (v) Object.assign(o, { v, color: t.color, bg: t.bg }); else d.overlays = d.overlays.filter(x => x.id !== t.id);
    } else if (v) {
      const o = { id: Date.now(), type: 'text', v, color: t.color, bg: t.bg, x: 50, y: 24 };
      d.overlays.push(o); S.edSel = o.id;
    }
    S.edText = null; render();
  },
  'ed-next'() {
    const c = device.querySelector('#canvas').getBoundingClientRect();
    obsDraft().ratio = `${Math.round(c.width)} / ${Math.round(c.height)}`;
    S.edSel = null; S.edTool = null;
    /* Coming back to a form that's already open: return to it rather than stacking a second one. */
    const i = S.stack.findIndex(s => s.name === 'new-obs');
    if (i < 0) return go('new-obs');
    S.stack = S.stack.slice(0, i + 1); S.dir = 'back'; render();
  },
  'ann-dismiss'() {
    if (S.annIdx < ANNOUNCEMENTS.length - 1) S.annIdx++; else S.annHidden = true;
    render();
  },
  classroom(p) { S.classroomFilter = p; render(); },
  'learn-child'(p) { S.learnChild = p; render(); },
  'obs-child'(p) { S.draft.obs.child = p; render(); },
  'cal-child'(p) { S.calChild = p; render(); },
  'msg-filter'(p) { S.msgFilter = p; render(); },
  'notif-filter'(p) { S.notifFilter = p; render(); },
  'journal-tab'(p) { S.journalTab = p; render(); },
  'ann-tab'(p) { S.annTab = p; render(); },
  like(p) { S.liked[p] = !S.liked[p]; render(); },
  menu(p, el) {
    const [kind, id] = p.split(':');
    const r = el.getBoundingClientRect(), d = device.getBoundingClientRect();
    const right = Math.round(d.right - r.right), below = r.bottom - d.top + 4;
    S.menu = below > d.height - 200 ? { kind, id, bottom: Math.round(d.bottom - r.top + 4), right } : { kind, id, top: Math.round(below), right };
    render();
  },
  'menu-close'() { S.menu = null; render(); },
  'tour-next'() {
    if (S.tour >= TOUR[S.role].length - 1) return tourDone();
    S.tour++; device.querySelector('.tour')?.remove(); drawTour();
  },
  'tour-skip'() { tourDone(); },
  tour() { startTour(); },
  'menu-edit'() { const { kind, id } = S.menu; S.menu = null; S.editChild = null; go(kind === 'post' ? 'edit-post' : 'edit-obs', id); },
  'menu-delete'() { const { kind, id } = S.menu; S.menu = null; S.confirm = { kind, id }; render(); },
  'confirm-cancel'() { S.confirm = null; render(); },
  'confirm-delete'() {
    const { kind, id } = S.confirm;
    if (kind === 'post') S.posts = S.posts.filter(x => x.id !== id); else S.obs = S.obs.filter(x => x.id !== id);
    S.confirm = null;
    /* Leave any detail or edit screen that was showing the deleted entry. */
    while (S.stack.length > 1 && S.stack.at(-1).p === id) S.stack.pop();
    S.dir = 'back';
    toast(kind === 'post' ? 'Update deleted' : 'Observation deleted');
  },
  'edit-child'(p) { S.editChild = p; render(); },
  'cal-day'(p) { S.calSel = +p; render(); },
  'cal-nav'(p) {
    const d = new Date(S.calYear, S.calMonth + +p, 1);
    S.calMonth = d.getMonth(); S.calYear = d.getFullYear();
    S.calSel = Math.min(S.calSel, new Date(S.calYear, S.calMonth + 1, 0).getDate());
    render();
  },
  decide(p, el) {
    const card = el.closest('.post');
    card.classList.add('leaving');
    setTimeout(() => {
      S.pending--; if (p === 'approve') S.approved++;
      S.toast = p === 'approve' ? 'Observation approved and added to Emma’s journal' : 'Observation declined — the family will be notified';
      render();
    }, 280);
  },
  'add-photo'(p) { S.draft[p].photo = true; render(); },
  toast(p) { toast(p); },
  'delete-event'() { back(); toast('Event deleted'); },
};

device.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go],[data-tab]');
  if (!el || !device.contains(el)) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.tab) return tab(el.dataset.tab);
  if (el.dataset.go) {
    const target = el.dataset.go === 'learning-tab' ? null : el.dataset.go;
    return target ? go(target, el.dataset.p) : tab('learning');
  }
  const fn = actions[el.dataset.act];
  if (fn) fn(el.dataset.p, el);
});

document.querySelector('.proto-bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.role) signIn(b.dataset.role);
  else if (b.dataset.act === 'restart') actions.restart();
  else if (b.dataset.act === 'tour') { if (!S.role) signIn('parent'); startTour(); }
});

/* Live inputs — update state without a full re-render so focus is kept. */
/* Photo editor: drag overlays around the canvas; a tap (no movement) selects,
   and tapping selected text reopens it for editing. */
device.addEventListener('pointerdown', e => {
  const ov = e.target.closest('#canvas .ov[data-id]');
  if (!ov || e.target.closest('.ov-del')) return;
  e.preventDefault();
  const canvas = device.querySelector('#canvas').getBoundingClientRect();
  const o = obsDraft().overlays.find(x => x.id === +ov.dataset.id);
  const sx = e.clientX, sy = e.clientY, ox = o.x, oy = o.y;
  let moved = false;
  ov.setPointerCapture(e.pointerId);
  ov.classList.add('dragging');
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true;
    o.x = Math.max(4, Math.min(96, ox + dx / canvas.width * 100));
    o.y = Math.max(4, Math.min(96, oy + dy / canvas.height * 100));
    ov.style.left = o.x + '%'; ov.style.top = o.y + '%';
  };
  const up = () => {
    ov.removeEventListener('pointermove', move); ov.removeEventListener('pointerup', up); ov.removeEventListener('pointercancel', up);
    if (!moved && S.edSel === o.id && o.type === 'text') S.edText = { id: o.id, v: o.v, color: o.color, bg: o.bg };
    S.edSel = o.id;
    render();
  };
  ov.addEventListener('pointermove', move); ov.addEventListener('pointerup', up); ov.addEventListener('pointercancel', up);
});

device.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'edText') { S.edText.v = el.innerText.replace(/\n$/, ''); return; }
  if (el.dataset.bind) {
    const [kind, key] = el.dataset.bind.split('.');
    S.draft[kind][key] = el.value;
    if (el.dataset.count) device.querySelector('#' + el.dataset.count).textContent = `${el.value.length} / 240`;
    device.querySelector('#createBtn').disabled = !formValid(kind);
  }
  if (el.dataset.input === 'obs-text') { S.draft.obs.text = el.value; device.querySelector('#obsCount').textContent = `${el.value.length} / 240`; }
  if (el.dataset.input === 'contact-q') device.querySelector('#contactList').innerHTML = contactRows(el.value);
  if (el.dataset.input === 'roster-q') { S.rosterQ = el.value; device.querySelector('#rosterList').innerHTML = rosterGroups(); }
});
device.addEventListener('change', e => {
  const el = e.target, c = el.dataset.change;
  if (el.dataset.bind) el.dispatchEvent(new Event('input', { bubbles: true }));
  if (c === 'learn-room') S.learnRoom = el.value;
  if (c === 'obs-room') S.draft.obs.room = el.value;
  if (c === 'roster-g') {
    S.rosterG = el.value;
    device.querySelector('#rosterList').innerHTML = rosterGroups();
    device.querySelector('#rosterHint').textContent = `Showing ${S.rosterG === 'All groups' ? 'all children' : S.rosterG} · sorted A–Z`;
  }
});

device.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'login') return signIn(S.role);
  if (kind === 'send') {
    const input = f.querySelector('input'), text = input.value.trim();
    if (!text) return;
    const now = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const thread = S.threads[f.dataset.p] ||= [];
    thread.forEach(m => m.fresh = false);
    thread.push({ me: 1, t: text, at: now, fresh: true });
    render();
    device.querySelector('.composer input').focus();
    return;
  }
  if (kind === 'comment') {
    const input = f.querySelector('input'), t = input.value.trim(), p = S.posts.find(x => x.id === f.dataset.p);
    if (!t) return;
    p.comments.push({ by: S.role === 'teacher' ? 'You · Homeroom teacher' : 'You · Emma’s mum', t });
    render();
    device.querySelector('.cmt:last-child')?.classList.add('new');
    device.querySelector('.body').scrollTop = 1e6;
    return;
  }
  if (kind === 'edit-post') {
    const p = S.posts.find(x => x.id === f.dataset.p), fd = new FormData(f);
    Object.assign(p, { group: fd.get('group'), title: fd.get('title').trim(), text: fd.get('text').trim() || p.text });
    back(); return toast('Update saved');
  }
  if (kind === 'edit-obs') {
    const o = S.obs.find(x => x.id === f.dataset.p);
    Object.assign(o, { child: S.editChild || o.child, text: new FormData(f).get('text').trim() || o.text });
    back(); return toast('Observation saved');
  }
  if (kind === 'obs') {
    const d = S.draft.obs, name = CHILDREN[d.child]?.name || 'the class';
    S.obs.unshift({ id: 'o' + Date.now(), child: d.child, by: S.role, ago: 'Just now', pending: S.role === 'parent',
      text: d.text.trim() || 'A new moment for the learning journal.', photo: d.noPhoto ? null : 'photo-capes.jpg', overlays: d.overlays, ratio: d.ratio });
    S.learnChild = d.child;
    S.stack = [{ name: 'learning' }]; S.dir = 'fwd';
    S.toast = S.role === 'teacher' ? `Observation posted to ${name}’s journal` : `Sent to TSK — a teacher will review it before it appears in ${name}’s journal`;
    return render();
  }
  if (kind === 'create') {
    const k = f.dataset.p, d = S.draft[k];
    S.created = { kind: k, title: d.title, when: fmtWhen(d.date, d.time), photo: d.photo ? 'photo-autumn.jpg' : null, body: d.body };
    S.stack.pop();
    if (k === 'announcement') {
      /* A class update becomes a real post the teacher can later edit or delete. */
      const id = 'p' + Date.now();
      S.posts.unshift({ id, by: 'teacher', group: d.group === 'All groups' ? 'Sunflower room' : d.group, ago: 'Just now', title: d.title.trim(), text: d.body.trim(), photo: d.photo ? 'photo-autumn.jpg' : null, likes: 0, comments: [] });
      go('post', id);
    } else go('event', 'new');
    toast(k === 'event' ? 'Event published to parents' : 'Announcement posted');
  }
});

/* Boot. ?role=parent|teacher skips straight to that dashboard. */
const qs = new URLSearchParams(location.search).get('role');
if (qs === 'parent' || qs === 'teacher') { S.role = qs; S.stack = [{ name: 'dashboard' }]; S.tour = tourSeen(qs) ? null : 0; }
else S.stack = [{ name: 'roles' }];
render();
</script>
